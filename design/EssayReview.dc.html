<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
    a { color: #1B8FD1; } a:hover { color: #146FA4; }
    .num { font-family: "Outfit", -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<!--
  批改结果。分数不是重点，「漏了哪几点、为什么漏」才是 —— 所以采分点
  逐条对照占最大篇幅，漏掉的用红底摊开写原因，命中的收成一行。
-->
<div style="width: 390px; height: 844px; background: #F2F8FC; color: #16232E; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 26px;"></div>

  <div style="display: flex; align-items: center; padding: 0 20px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16232E" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 13px; font-weight: 600; color: #1B8FD1;">看参考答案</div>
  </div>

  <div style="height: 22px;"></div>

  <!-- 成绩：两条信息 —— 分数和要点覆盖 -->
  <div style="margin: 0 20px; background: #FFFFFF; border-radius: 26px; padding: 22px; box-shadow: 0 14px 30px rgba(22,60,90,0.10);">
    <div class="num" style="font-size: 11.5px; font-weight: 700; color: #98A6B2; letter-spacing: 0.8px;">归纳概括</div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 10px;">
      <div class="num" style="font-size: 46px; font-weight: 700; letter-spacing: -1.6px; line-height: 1;">14</div>
      <div class="num" style="font-size: 16px; font-weight: 600; color: #98A6B2;">/ 20</div>
      <div style="flex-grow: 1;"></div>
      <div class="num" style="background: #FFF3E8; color: #C25A18; border-radius: 99px; padding: 6px 13px; font-size: 12.5px; font-weight: 700;">要点 3 / 5</div>
    </div>
    <div style="margin-top: 12px;"><svg width="306" height="34" viewBox="0 0 306 34" style="display: block;">
      <path d="M8 22 Q 48 14 88 22 T 168 22 T 248 22 T 298 20" fill="none" stroke="#DCE6EE" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
      <path d="M8 22 Q 48 14 88 22 T 168 22 T 248 22 T 298 20" fill="none" stroke="#FFC94A" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="306 306" stroke-dashoffset="103"/>
      <circle cx="8" cy="20.5" r="1.6" fill="#FFC94A" opacity="0.45"/><circle cx="25" cy="18.5" r="1.6" fill="#FFC94A" opacity="0.59"/><circle cx="42" cy="20.5" r="1.6" fill="#FFC94A" opacity="0.73"/><g transform="translate(208 20)">
      <path d="M-8 2 L8 2 L5.5 7 L-5.5 7 Z" fill="#4A3410"/>
      <path d="M0 2 L0 -9 L7 -2 L0 -2" fill="#FFC94A" stroke="#4A3410" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
      <g transform="translate(294 22)">
        <path d="M-3.4 0 L-2.2 -13 L2.2 -13 L3.4 0 Z" fill="#B7C6D1"/>
        <rect x="-2.8" y="-17" width="5.6" height="4.2" rx="1.2" fill="#FFC94A"/>
      </g>
    </svg></div>
  </div>

  <div style="height: 30px;"></div>

  <div style="display: flex; align-items: baseline; padding: 0 20px;">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">采分点</div>
    <div style="flex-grow: 1;"></div>
    <div class="num" style="font-size: 12.5px; font-weight: 600; color: #E2483D;">漏了 2 点</div>
  </div>

  <div style="height: 12px;"></div>

  <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 9px;">

    <!-- 命中的收成一行 -->
    <div style="background: #FFFFFF; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 11px; box-shadow: 0 6px 16px rgba(22,60,90,0.05);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#12A06B"/><path d="M8 12.4l2.6 2.6L16 9.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex-grow: 1; font-size: 14px; color: #4A5866;">填报负担重</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 11px; box-shadow: 0 6px 16px rgba(22,60,90,0.05);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#12A06B"/><path d="M8 12.4l2.6 2.6L16 9.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex-grow: 1; font-size: 14px; color: #4A5866;">系统重复录入</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 11px; box-shadow: 0 6px 16px rgba(22,60,90,0.05);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#12A06B"/><path d="M8 12.4l2.6 2.6L16 9.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex-grow: 1; font-size: 14px; color: #4A5866;">网格员编制不足</div>
    </div>

    <!-- 漏掉的摊开写原因 —— 这才是这一屏的价值 -->
    <div style="background: #FDEFEC; border-radius: 18px; padding: 15px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#E2483D"/><path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 700; color: #16232E;">群众参与度低</div>
      </div>
      <div style="font-size: 13px; line-height: 1.75; color: #7A3B32; margin-top: 10px; margin-left: 29px;">材料二末段说「多数居民不知道网格员是谁」。这句在段尾，容易被当成背景略过 —— 但它是并列的一条问题，不是铺垫。</div>
    </div>

    <div style="background: #FDEFEC; border-radius: 18px; padding: 15px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#E2483D"/><path d="M9 9l6 6M15 9l-6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        <div style="flex-grow: 1; font-size: 14.5px; font-weight: 700; color: #16232E;">考核指标单一</div>
      </div>
      <div style="font-size: 13px; line-height: 1.75; color: #7A3B32; margin-top: 10px; margin-left: 29px;">材料三整段都在说「只考核办结率」。整段一个意思时容易只摘一句，反而丢了这条。</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 28px 20px; display: flex; gap: 11px;">
    <div style="flex-grow: 1; background: #FFFFFF; color: #4A5866; border-radius: 99px; padding: 15px; text-align: center; font-size: 14.5px; font-weight: 600; box-shadow: 0 6px 16px rgba(22,60,90,0.06);">存进日志</div>
    <div style="flex-grow: 1; background: #FFC94A; color: #4A3410; border-radius: 99px; padding: 15px; text-align: center; font-size: 14.5px; font-weight: 700; box-shadow: 0 8px 20px rgba(255,201,74,0.38);">再写一遍</div>
  </div>

</div>
</x-dc>
</body>
</html>
