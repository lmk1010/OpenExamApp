<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
    a { color: #1B8FD1; } a:hover { color: #146FA4; }
    .num { font-family: "Outfit", -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F2F8FC; color: #16232E; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 34px;"></div>

  <div style="display: flex; align-items: center; padding: 0 20px; gap: 14px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16232E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
    <div style="flex-grow: 1;">
      <div class="num" style="font-size: 11.5px; color: #98A6B2; letter-spacing: 0.6px;">练过 14 道</div>
      <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.7px; line-height: 1.15; margin-top: 4px;">申论</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 99px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22,60,90,0.06);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5B6E7D" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  </div>

  <div style="height: 24px;"></div>

  <!-- 今天这一道：一屏只推一件事 -->
  <div style="margin: 0 20px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 14px 30px rgba(22,60,90,0.10);">
    <div style="position: relative; height: 142px; border-radius: 26px 26px 0 0; overflow: hidden;">
      <img src="day_essay.jpg" style="width: 350px; height: 142px; object-fit: cover; display: block;">
      <svg width="350" height="20" viewBox="0 0 350 20" style="position: absolute; left: 0; bottom: -1px; display: block;"><path d="M0 12 Q 43.75 2 87.5 12 T 175 12 T 262.5 12 T 350 12 L350 20 L0 20 Z" fill="#FFFFFF"/></svg>
    </div>
    <div style="padding: 20px;">
      <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.4;">2025 国考副省级<br>第一题 · 归纳概括</div>
      <div class="num" style="font-size: 13px; color: #7A8B99; margin-top: 9px;">200 字 · 建议 20 分钟</div>
      <div style="background: #FFC94A; color: #4A3410; border-radius: 99px; padding: 15px; text-align: center; font-size: 15.5px; font-weight: 700; margin-top: 18px; box-shadow: 0 8px 20px rgba(255,201,74,0.38);">开始作答</div>
    </div>
  </div>

  <div style="height: 32px;"></div>

  <div style="display: flex; align-items: baseline; padding: 0 20px;">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">练过的</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 12.5px; font-weight: 600; color: #1B8FD1;">全部</div>
  </div>

  <div style="height: 12px;"></div>

  <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 11px;">

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; box-shadow: 0 10px 24px rgba(22,60,90,0.07); display: flex; align-items: center; gap: 14px;">
      <div style="flex-grow: 1;">
        <div style="font-size: 14.5px; font-weight: 600; line-height: 1.4;">2025 浙江 A 卷 · 提出对策</div>
        <div style="display: flex; align-items: center; gap: 7px; margin-top: 7px;">
          <div style="background: #E0F5F2; color: #0B7A72; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;">提出对策</div>
          <div class="num" style="font-size: 11.5px; color: #98A6B2;">3 天前</div>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="num" style="font-size: 20px; font-weight: 700; color: #12A06B; line-height: 1;">16</div>
        <div class="num" style="font-size: 10.5px; color: #98A6B2; margin-top: 3px;">/ 20</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; box-shadow: 0 10px 24px rgba(22,60,90,0.07); display: flex; align-items: center; gap: 14px;">
      <div style="flex-grow: 1;">
        <div style="font-size: 14.5px; font-weight: 600; line-height: 1.4;">2024 国考市地级 · 综合分析</div>
        <div style="display: flex; align-items: center; gap: 7px; margin-top: 7px;">
          <div style="background: #F0EBFC; color: #5A3FB0; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;">综合分析</div>
          <div class="num" style="font-size: 11.5px; color: #98A6B2;">6 天前</div>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="num" style="font-size: 20px; font-weight: 700; color: #E0A21E; line-height: 1;">12</div>
        <div class="num" style="font-size: 10.5px; color: #98A6B2; margin-top: 3px;">/ 20</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; box-shadow: 0 10px 24px rgba(22,60,90,0.07); display: flex; align-items: center; gap: 14px;">
      <div style="flex-grow: 1;">
        <div style="font-size: 14.5px; font-weight: 600; line-height: 1.4;">2024 江苏 B 卷 · 归纳概括</div>
        <div style="display: flex; align-items: center; gap: 7px; margin-top: 7px;">
          <div style="background: #E3F2FA; color: #1B6FA8; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;">归纳概括</div>
          <div class="num" style="font-size: 11.5px; color: #98A6B2;">9 天前</div>
        </div>
      </div>
      <div style="text-align: right;">
        <div class="num" style="font-size: 20px; font-weight: 700; color: #12A06B; line-height: 1;">17</div>
        <div class="num" style="font-size: 10.5px; color: #98A6B2; margin-top: 3px;">/ 20</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 26px 20px;">
    <div style="background: #FFFFFF; border-radius: 99px; padding: 7px; display: flex; align-items: center; gap: 2px; box-shadow: 0 10px 28px rgba(22,60,90,0.14);">
      <div style="display: flex; align-items: center; gap: 7px; background: #FFC94A; border-radius: 99px; padding: 11px 17px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A3410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.2c1.5.9 3 .9 4.5 0s3-.9 4.5 0 3 .9 4.5 0"/><path d="M17.5 4.5L9 13"/><path d="M18.8 3.2a1.8 1.8 0 010 2.6l-1.3 1.3-2.6-2.6 1.3-1.3a1.8 1.8 0 012.6 0z"/><path d="M9 13l-2.4.6.6-2.4"/></svg>
        <div style="font-size: 13.5px; font-weight: 700; color: #4A3410;">练习</div>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5A2.5 2.5 0 017 3h12.5v18H7a2.5 2.5 0 01-2.5-2.5z"/><path d="M8.5 8h7M8.5 11.5h4.5"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5A1.5 1.5 0 017.5 3h9A1.5 1.5 0 0118 4.5V21l-6-4.2L6 21z"/><path d="M10 8.5l4 4M14 8.5l-4 4"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.8 20.5c1.2-3.8 4-5.7 7.2-5.7s6 1.9 7.2 5.7"/></svg>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
