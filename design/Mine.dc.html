<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
    a { color: #1B8FD1; } a:hover { color: #146FA4; }
    .num { font-family: "Outfit", -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F2F8FC; color: #16232E; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 32px;"></div>

  <div style="display: flex; align-items: center; padding: 0 20px; gap: 10px;">
    <div style="flex-grow: 1;">
      <div class="num" style="font-size: 11.5px; color: #98A6B2; letter-spacing: 0.6px;">备考中</div>
      <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.7px; line-height: 1.15; margin-top: 4px;">我的</div>
    </div>
    <div style="width: 38px; height: 38px; border-radius: 99px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22,60,90,0.06);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5B6E7D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    </div>
  </div>

  <div style="height: 22px;"></div>

  <!-- 航程总览：跟首页的航程卡是同一套语言，只是统计的是全程不是今天 -->
  <div style="margin: 0 20px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 14px 30px rgba(22,60,90,0.10);">
    <div style="height: 96px; position: relative;">
      <img src="day_arrive.jpg" style="position: absolute; top: 0; left: 0; width: 350px; height: 96px; object-fit: cover; border-radius: 26px 26px 0 0;">
      <div class="num" style="position: absolute; left: 18px; bottom: -22px; width: 52px; height: 52px; border-radius: 99px; background: #FFFFFF; color: #B8730F; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(22,60,90,0.16);">备</div>
    </div>

    <!-- 三个 25px 数字并排像仪表盘。留一个大的当主角，其余降成一行小字 -->
    <div style="padding: 36px 20px 20px 20px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div class="num" style="font-size: 42px; font-weight: 700; letter-spacing: -1.4px; line-height: 1;">1 284</div>
        <div style="font-size: 14px; font-weight: 600; color: #98A6B2;">题</div>
      </div>
      <div class="num" style="font-size: 13px; color: #7A8B99; margin-top: 10px;">正确率 72% · 离岸 43 天</div>
    </div>
  </div>

  <div style="height: 26px;"></div>

  <!-- 常用入口：一块卡里的宫格 -->
  <div style="margin: 0 20px; background: #FFFFFF; border-radius: 22px; padding: 8px 4px; box-shadow: 0 10px 24px rgba(22,60,90,0.07); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0;">
      <img src="ico_achieve.png" style="width: 34px; height: 34px; display: block;">
      <div style="font-size: 11.5px; font-weight: 500;">成就</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0;">
      <img src="ico_history.png" style="width: 34px; height: 34px; display: block;">
      <div style="font-size: 11.5px; font-weight: 500;">记录</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0;">
      <img src="ico_note.png" style="width: 34px; height: 34px; display: block;">
      <div style="font-size: 11.5px; font-weight: 500;">笔记</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0;">
      <img src="ico_mark.png" style="width: 34px; height: 34px; display: block;">
      <div style="font-size: 11.5px; font-weight: 500;">收藏</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0;">
      <img src="ico_report.png" style="width: 34px; height: 34px; display: block;">
      <div style="font-size: 11.5px; font-weight: 500;">报告</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0;">
      <img src="ico_stats.png" style="width: 34px; height: 34px; display: block;">
      <div style="font-size: 11.5px; font-weight: 500;">统计</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0;">
      <img src="ico_tips.png" style="width: 34px; height: 34px; display: block;">
      <div style="font-size: 11.5px; font-weight: 500;">技巧</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0;">
      <img src="ico_fix.png" style="width: 34px; height: 34px; display: block;">
      <div style="font-size: 11.5px; font-weight: 500;">纠错</div>
    </div>
  </div>

  <div style="height: 26px;"></div>

  <div style="padding: 0 20px;">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">备考设置</div>
  </div>
  <div style="height: 11px;"></div>

  <div style="margin: 0 20px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 10px 24px rgba(22,60,90,0.07); overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5866" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18H6z"/><path d="M9.5 8.5l1.4 1.4 3-3M9.5 15l1.4 1.4 3-3"/></svg>
      <div style="flex-grow: 1; font-size: 15px;">复习计划</div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B7C6D1" stroke-width="2" stroke-linecap="round"><path d="M10 6l6 6-6 6"/></svg>
    </div>
    <div style="height: 1px; background: #EDF3F7; margin-left: 49px;"></div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5866" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <div style="flex-grow: 1; font-size: 15px;">报考地区</div>
      <div style="font-size: 13px; color: #7A8B99;">浙江</div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B7C6D1" stroke-width="2" stroke-linecap="round"><path d="M10 6l6 6-6 6"/></svg>
    </div>
    <div style="height: 1px; background: #EDF3F7; margin-left: 49px;"></div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5866" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A1.5 1.5 0 015.5 5h13A1.5 1.5 0 0120 6.5V19H4z"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      <div style="flex-grow: 1; font-size: 15px;">考试日期</div>
      <div class="num" style="font-size: 13px; color: #7A8B99;">10 月 17 日</div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B7C6D1" stroke-width="2" stroke-linecap="round"><path d="M10 6l6 6-6 6"/></svg>
    </div>
    <div style="height: 1px; background: #EDF3F7; margin-left: 49px;"></div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5866" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      <div style="flex-grow: 1; font-size: 15px;">更多设置</div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B7C6D1" stroke-width="2" stroke-linecap="round"><path d="M10 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 26px 20px;">
    <div style="background: #FFFFFF; border-radius: 99px; padding: 7px; display: flex; align-items: center; gap: 2px; box-shadow: 0 10px 28px rgba(22,60,90,0.14);">
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.2c1.5.9 3 .9 4.5 0s3-.9 4.5 0 3 .9 4.5 0"/><path d="M17.5 4.5L9 13"/><path d="M18.8 3.2a1.8 1.8 0 010 2.6l-1.3 1.3-2.6-2.6 1.3-1.3a1.8 1.8 0 012.6 0z"/><path d="M9 13l-2.4.6.6-2.4"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5A2.5 2.5 0 017 3h12.5v18H7a2.5 2.5 0 01-2.5-2.5z"/><path d="M8.5 8h7M8.5 11.5h4.5"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5A1.5 1.5 0 017.5 3h9A1.5 1.5 0 0118 4.5V21l-6-4.2L6 21z"/><path d="M10 8.5l4 4M14 8.5l-4 4"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; background: #FFC94A; border-radius: 99px; padding: 11px 17px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A3410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.8 20.5c1.2-3.8 4-5.7 7.2-5.7s6 1.9 7.2 5.7"/></svg>
        <div style="font-size: 13.5px; font-weight: 700; color: #4A3410;">我的</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
