<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
    a { color: #1B8FD1; } a:hover { color: #146FA4; }
    .num { font-family: "Outfit", -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F2F8FC; color: #16232E; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 34px;"></div>
  <div style="display: flex; align-items: center; padding: 0 20px; gap: 14px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16232E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
      <div style="flex-grow: 1;">
      <div class="num" style="font-size: 11.5px; color: #98A6B2; letter-spacing: 0.6px;">186 条</div>
      <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.7px; line-height: 1.15; margin-top: 4px;">航海日志</div>
    </div>
  </div>
  <div style="height: 24px;"></div>

  <div style="margin: 0 20px; background: #FFFFFF; border-radius: 99px; padding: 13px 18px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 20px rgba(22,60,90,0.06);">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <div style="font-size: 14px; color: #98A6B2;">搜正文、标签</div>
  </div>

  <div style="height: 14px;"></div>

  <div style="padding: 0 20px; display: flex; gap: 8px;">
    <div class="num" style="background: #FFC94A; color: #4A3410; font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 99px;">全部 186</div>
    <div class="num" style="background: #FFFFFF; color: #5B6E7D; font-size: 12.5px; padding: 7px 14px; border-radius: 99px;">错因 42</div>
    <div class="num" style="background: #FFFFFF; color: #5B6E7D; font-size: 12.5px; padding: 7px 14px; border-radius: 99px;">词语 61</div>
  </div>

  <div style="height: 24px;"></div>

  <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 11px;">

    <div style="background: #FFFFFF; border-radius: 20px; padding: 17px; box-shadow: 0 10px 24px rgba(22,60,90,0.07);">
      <div style="font-size: 15px; font-weight: 700;">年均增长率要开方</div>
      <div style="font-size: 13.5px; line-height: 1.7; color: #5B6E7D; margin-top: 7px;">不是除以年数。n 年从 A 到 B，年均增长率是 n 次根号下 B/A 再减一。</div>
      <div style="display: flex; align-items: center; gap: 7px; margin-top: 12px;">
        <div style="background: #E0F5F2; color: #0B7A72; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;">资料分析</div>
        <div class="num" style="font-size: 11.5px; color: #98A6B2;">2 天前</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 17px; box-shadow: 0 10px 24px rgba(22,60,90,0.07);">
      <div style="font-size: 15px; font-weight: 700;">截然不同 / 迥然不同</div>
      <div style="font-size: 13.5px; line-height: 1.7; color: #5B6E7D; margin-top: 7px;">前者强调界限分明，后者强调差别之大。填空里看有没有"界限"这层意思。</div>
      <div style="display: flex; align-items: center; gap: 7px; margin-top: 12px;">
        <div style="background: #E3F2FA; color: #1B6FA8; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;">逻辑填空</div>
        <div class="num" style="font-size: 11.5px; color: #98A6B2;">4 天前</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 17px; box-shadow: 0 10px 24px rgba(22,60,90,0.07);">
      <div style="font-size: 15px; font-weight: 700;">图形推理先数点线角面</div>
      <div style="font-size: 13.5px; line-height: 1.7; color: #5B6E7D; margin-top: 7px;">数量规律找不到再看位置和样式，顺序反了会浪费时间。</div>
      <div style="display: flex; align-items: center; gap: 7px; margin-top: 12px;">
        <div style="background: #F0EBFC; color: #5A3FB0; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;">判断推理</div>
        <div class="num" style="font-size: 11.5px; color: #98A6B2;">5 天前</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="padding: 0 20px 26px 20px;">
    <div style="background: #FFFFFF; border-radius: 99px; padding: 7px; display: flex; align-items: center; gap: 2px; box-shadow: 0 10px 28px rgba(22,60,90,0.14);">
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.2c1.5.9 3 .9 4.5 0s3-.9 4.5 0 3 .9 4.5 0"/><path d="M17.5 4.5L9 13"/><path d="M18.8 3.2a1.8 1.8 0 010 2.6l-1.3 1.3-2.6-2.6 1.3-1.3a1.8 1.8 0 012.6 0z"/><path d="M9 13l-2.4.6.6-2.4"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5A2.5 2.5 0 017 3h12.5v18H7a2.5 2.5 0 01-2.5-2.5z"/><path d="M8.5 8h7M8.5 11.5h4.5"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5A1.5 1.5 0 017.5 3h9A1.5 1.5 0 0118 4.5V21l-6-4.2L6 21z"/><path d="M10 8.5l4 4M14 8.5l-4 4"/></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; background: #FFC94A; border-radius: 99px; padding: 11px 17px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A3410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.8 20.5c1.2-3.8 4-5.7 7.2-5.7s6 1.9 7.2 5.7"/></svg>
        <div style="font-size: 13.5px; font-weight: 700; color: #4A3410;">我的</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
