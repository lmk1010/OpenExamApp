<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
    a { color: #1B8FD1; } a:hover { color: #146FA4; }
    .num { font-family: "Outfit", -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<!--
  做减法。上一版每一块塞 4–6 条信息：
  航程卡有灯塔药丸、离岸药丸、12/30、76%、进度条、一句话，共六条。
  拥挤不是间距不够，是每块信息太多。现在每块只留 2–3 条：
    航程卡 = 大数字 + 进度条 + 一句话
    航线行 = 名字 + 题数
    岛卡   = 名字 + 题数
  正确率挪到「我的」，离岸天数挪到顶部副标题。
-->
<div style="width: 390px; height: 844px; background: #F2F8FC; color: #16232E; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 34px;"></div>

  <div style="display: flex; align-items: center; padding: 0 20px; gap: 10px;">
    <div style="flex-grow: 1;">
      <div class="num" style="font-size: 11.5px; color: #98A6B2; letter-spacing: 0.6px;">离岸 43 天</div>
      <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.7px; line-height: 1.15; margin-top: 4px;">练习</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 99px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22,60,90,0.06);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5B6E7D" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 99px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(22,60,90,0.06);">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5B6E7D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    </div>
  </div>

  <div style="height: 24px;"></div>

  <!-- 航程卡：三条信息 —— 大数字、进度、一句话 -->
  <div style="margin: 0 20px; border-radius: 26px; overflow: hidden; background: #FFFFFF; box-shadow: 0 14px 30px rgba(22,60,90,0.10);">
    <div style="position: relative; height: 150px;">
      <img src="day_voyage.jpg" style="width: 350px; height: 150px; object-fit: cover; display: block;">
      <svg width="350" height="20" viewBox="0 0 350 20" style="position: absolute; left: 0; bottom: -1px; display: block;"><path d="M0 12 Q 43.75 2 87.5 12 T 175 12 T 262.5 12 T 350 12 L350 20 L0 20 Z" fill="#FFFFFF"/></svg>
    </div>
    <div style="padding: 20px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div class="num" style="font-size: 46px; font-weight: 700; letter-spacing: -1.5px; line-height: 1;">12</div>
        <div class="num" style="font-size: 15px; font-weight: 600; color: #98A6B2;">/ 30</div>
      </div>
      <div style="margin-top: 12px;"><svg width="310" height="34" viewBox="0 0 310 34" style="display: block;">
      <path d="M8 22 Q 48 14 88 22 T 168 22 T 248 22 T 302 20" fill="none" stroke="#DCE6EE" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
      <path d="M8 22 Q 48 14 88 22 T 168 22 T 248 22 T 302 20" fill="none" stroke="#FFC94A" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="310 310" stroke-dashoffset="192"/>
      <circle cx="8" cy="20.5" r="1.6" fill="#FFC94A" opacity="0.45"/><circle cx="25" cy="18.5" r="1.6" fill="#FFC94A" opacity="0.59"/><circle cx="42" cy="20.5" r="1.6" fill="#FFC94A" opacity="0.73"/><g transform="translate(124 20)">
      <path d="M-8 2 L8 2 L5.5 7 L-5.5 7 Z" fill="#4A3410"/>
      <path d="M0 2 L0 -9 L7 -2 L0 -2" fill="#FFC94A" stroke="#4A3410" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
      <g transform="translate(298 22)">
        <path d="M-3.4 0 L-2.2 -13 L2.2 -13 L3.4 0 Z" fill="#B7C6D1"/>
        <rect x="-2.8" y="-17" width="5.6" height="4.2" rx="1.2" fill="#FFC94A"/>
      </g>
    </svg></div>
      <div style="font-size: 13px; color: #7A8B99; margin-top: 6px;">今天还要划 18 题</div>
    </div>
  </div>

  <div style="height: 32px;"></div>

  <!-- 今日航线：每行只有名字和题数 -->
  <div style="display: flex; align-items: baseline; padding: 0 20px;">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">今日航线</div>
    <div style="flex-grow: 1;"></div>
    <div class="num" style="font-size: 12.5px; color: #98A6B2;">1 / 5</div>
  </div>

  <div style="height: 12px;"></div>

  <div style="margin: 0 20px; background: #FFFFFF; border-radius: 22px; box-shadow: 0 10px 24px rgba(22,60,90,0.07); overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 13px; padding: 15px 16px; background: #FFF6E0;">
      <svg width="21" height="21" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#E0A21E" stroke-width="3"/><g stroke="#FFF6E0" stroke-width="2.4" stroke-linecap="round"><path d="M13 3v4M13 19v4M3 13h4M19 13h4"/></g><circle cx="13" cy="13" r="4.4" fill="#FFC94A"/></svg>
      <div style="flex-grow: 1; font-size: 15px; font-weight: 700;">资料分析 · 限时</div>
      <div style="background: #FFC94A; color: #4A3410; border-radius: 99px; padding: 9px 18px; font-size: 13.5px; font-weight: 700;">开始</div>
    </div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px;">
      <svg width="21" height="21" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="#12A06B"/><g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.55"><path d="M13 3v4M13 19v4M3 13h4M19 13h4"/></g><path d="M9 13.4l2.7 2.7L17.2 10" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="flex-grow: 1; font-size: 14.5px; color: #98A6B2;">错题回炉</div>
      <div class="num" style="font-size: 12.5px; color: #98A6B2;">10 题</div>
    </div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px;">
      <svg width="21" height="21" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#D3DDE5" stroke-width="3"/><g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M13 3v4M13 19v4M3 13h4M19 13h4"/></g></svg>
      <div style="flex-grow: 1; font-size: 14.5px;">言语专项</div>
      <div class="num" style="font-size: 12.5px; color: #7A8B99;">30 题</div>
    </div>
    <div style="display: flex; align-items: center; gap: 13px; padding: 14px 16px;">
      <svg width="21" height="21" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#D3DDE5" stroke-width="3"/><g stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M13 3v4M13 19v4M3 13h4M19 13h4"/></g></svg>
      <div style="flex-grow: 1; font-size: 14.5px;">申论 · 概括分析</div>
      <div class="num" style="font-size: 12.5px; color: #7A8B99;">1 题</div>
    </div>
  </div>

  <div style="height: 32px;"></div>

  <div style="display: flex; align-items: baseline; padding: 0 20px;">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">五座岛</div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 12.5px; font-weight: 600; color: #1B8FD1;">全部</div>
  </div>

  <div style="height: 12px;"></div>

  <div style="padding-left: 20px; display: flex; gap: 12px;">
    <div style="width: 130px; background: #FFFFFF; border-radius: 20px; overflow: hidden; flex-shrink: 0; box-shadow: 0 8px 20px rgba(22,60,90,0.07);">
      <img src="day_yanyu.jpg" style="width: 130px; height: 92px; object-fit: cover; display: block;">
      <div style="padding: 11px 13px 13px 13px;">
        <div style="font-size: 14px; font-weight: 700;">言语理解</div>
        <div class="num" style="font-size: 11px; color: #98A6B2; margin-top: 3px;">4 825</div>
      </div>
    </div>
    <div style="width: 130px; background: #FFFFFF; border-radius: 20px; overflow: hidden; flex-shrink: 0; box-shadow: 0 8px 20px rgba(22,60,90,0.07);">
      <img src="day_shuliang.jpg" style="width: 130px; height: 92px; object-fit: cover; display: block;">
      <div style="padding: 11px 13px 13px 13px;">
        <div style="font-size: 14px; font-weight: 700;">数量关系</div>
        <div class="num" style="font-size: 11px; color: #98A6B2; margin-top: 3px;">2 256</div>
      </div>
    </div>
    <div style="width: 130px; background: #FFFFFF; border-radius: 20px; overflow: hidden; flex-shrink: 0;">
      <img src="day_panduan.jpg" style="width: 130px; height: 92px; object-fit: cover; display: block;">
      <div style="padding: 11px 13px 13px 13px;">
        <div style="font-size: 14px; font-weight: 700;">判断推理</div>
        <div class="num" style="font-size: 11px; color: #98A6B2; margin-top: 3px;">5 072</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 20px 26px 20px;">
    <div style="background: #FFFFFF; border-radius: 99px; padding: 7px; display: flex; align-items: center; gap: 2px; box-shadow: 0 10px 28px rgba(22,60,90,0.14);">
      <div style="display: flex; align-items: center; gap: 7px; background: #FFC94A; border-radius: 99px; padding: 11px 17px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A3410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18.2c1.5.9 3 .9 4.5 0s3-.9 4.5 0 3 .9 4.5 0"/><path d="M17.5 4.5L9 13"/><path d="M18.8 3.2a1.8 1.8 0 010 2.6l-1.3 1.3-2.6-2.6 1.3-1.3a1.8 1.8 0 012.6 0z"/><path d="M9 13l-2.4.6.6-2.4"/></svg>
        <div style="font-size: 13.5px; font-weight: 700; color: #4A3410;">练习</div>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5A2.5 2.5 0 017 3h12.5v18H7a2.5 2.5 0 01-2.5-2.5z"/><path d="M8.5 8h7M8.5 11.5h4.5"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5A1.5 1.5 0 017.5 3h9A1.5 1.5 0 0118 4.5V21l-6-4.2L6 21z"/><path d="M10 8.5l4 4M14 8.5l-4 4"/></svg>
      </div>
      <div style="flex-grow: 1; display: flex; justify-content: center; padding: 11px 0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#98A6B2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.8"/><path d="M4.8 20.5c1.2-3.8 4-5.7 7.2-5.7s6 1.9 7.2 5.7"/></svg>
      </div>
    </div>

</div>
