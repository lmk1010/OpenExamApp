name: openexam_app
description: "OpenExam 公务员本地刷题 App"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  pdfx: 2.9.1
  image: ^4.5.4
  url_launcher: ^6.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.1.2
  archive: ^4.0.7
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # widget 测试要 pump 整个 app，app 一起来就开库。
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    # 目录形式：题库在不在都能构建。见 bank/README.md
    - assets/seed/
    - assets/shore/
